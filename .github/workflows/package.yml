name: Package RootHide DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    env:
      THEOS: /tmp/theos
    steps:
      - uses: actions/checkout@v6

      - name: Check source contract
        run: python3 tests/test_contract.py

      - name: Install build dependencies
        run: brew install ldid dpkg xz

      - name: Set up Theos and iOS SDK
        run: |
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build RootHide package
        run: make clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Verify RootHide package
        run: |
          deb=$(find packages -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64e
          ! dpkg-deb -f "$deb" | grep -q 'rootless-compat'
          dpkg-deb --ctrl-tarfile "$deb" | tar -tf - | grep -q './postinst'
          dpkg-deb -c "$deb" | grep -q 'CTLowPower.dylib'
          dpkg-deb -c "$deb" | grep -q 'CTLowPowerForeground.dylib'
          dpkg-deb -c "$deb" | grep -q 'CTLowPowerSettings.bundle/Info.plist'
          dpkg-deb -c "$deb" | grep -q 'PreferenceLoader/Preferences/CTLowPowerSettings.plist'
          for icon in icon.png icon@2x.png icon@3x.png; do
            dpkg-deb -c "$deb" | grep -q "CTLowPowerSettings.bundle/$icon"
          done

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: cputhermal-lowpower-roothide
          path: packages/*.deb
          if-no-files-found: error
